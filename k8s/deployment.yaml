apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversao-temp
spec:
  replicas: 5
  selector:
    matchLabels:
      app: conversao
  template:
    metadata:
      labels:
        app: conversao
    spec:
      containers:
      - name: conversao
        image: rangelcr/conversao-temperatura
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
--- 
apiVersion: v1
kind: Service
metadata:
  name: conversao
spec:
  selector:
    app: conversao
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080




